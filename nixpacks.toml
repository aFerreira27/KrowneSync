[variables]
NIXPACKS_PYTHON_VERSION = "3.11"

[phases.setup]
aptPkgs = ["python3", "python3-pip", "python3-venv", "python3-dev"]

[phases.install]
cmds = [
  "cd backend",
  "pip3 install -r requirements.txt"
]

[phases.build]
cmds = ["mkdir -p backend/data backend/uploads backend/logs"]

[start]
cmd = "cd backend && python3 run.py"